name: Publish to Comfy Registry

# Publishes the pack when its version or metadata changes on main, or when run by hand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish the pack to the registry
    runs-on: ubuntu-latest
    # Forks have no registry key, so the job would only fail there.
    if: ${{ github.repository_owner == 'igorls' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish the pack
        # Pinned to a commit, since this step holds the registry key. Tip of main on 2026-11-15.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
